name: Build RuangChat APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL HTTPS Cloudflare dari server, contoh https://xxxx.trycloudflare.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ruangchat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and normalize server URL
        id: server
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = (process.env.API_BASE_URL || '').trim().replace(/\/+$/, '');
          let url;
          try { url = new URL(raw); } catch { console.error('URL server tidak valid'); process.exit(1); }
          if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) {
            console.error('Masukkan URL HTTPS Cloudflare yang valid, tanpa kredensial.'); process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.origin}\n`);
          console.log(`Server URL: ${url.origin}`);
          NODE
      - name: Build React frontend
        env:
          VITE_API_BASE_URL: ${{ steps.server.outputs.url }}
        run: npm run build
      - name: Verify frontend output
        run: test -s client/dist/index.html
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuangChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        if: success()
        run: echo "## RuangChat APK berhasil dibuat :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
